<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="How the skill works: your brief feeds the planner, the planner sets limits and a calendar, the creative playbook shapes the ads, every channel is staged paused, the owner says launch, results feed next year">
  <defs>
    <pattern id="g2" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".03"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E63946"/></marker>
    <clipPath id="r2"><rect width="1200" height="760" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#r2)" font-family="'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif">
    <rect width="1200" height="760" fill="#030303"/>
    <rect width="1200" height="760" fill="url(#g2)"/>

    <text x="56" y="62" font-size="15" font-weight="600" letter-spacing="3" fill="#E63946">THE ECOSYSTEM</text>
    <text x="56" y="100" font-size="32" font-weight="700" fill="#FFFFFF" letter-spacing="-.5">Five parts, one loop</text>

    <!-- column headers -->
    <g font-size="14" font-weight="600" letter-spacing="2.5" fill="#646473">
      <text x="56" y="160">1 · YOUR BRIEF</text>
      <text x="346" y="160">2 · THE PLAN</text>
      <text x="636" y="160">3 · THE CREATIVE</text>
      <text x="926" y="160">4 · THE CHANNELS</text>
    </g>

    <!-- col 1: data -->
    <g font-size="18" fill="#FFFFFF">
      <g fill="#09090D" stroke="#FFFFFF" stroke-opacity=".1">
        <rect x="56" y="178" width="232" height="52" rx="12"/><rect x="56" y="240" width="232" height="52" rx="12"/>
        <rect x="56" y="302" width="232" height="52" rx="12"/><rect x="56" y="364" width="232" height="52" rx="12"/>
        <rect x="56" y="426" width="232" height="52" rx="12"/><rect x="56" y="488" width="232" height="52" rx="12"/>
      </g>
      <text x="76" y="211">The offer and dates</text><text x="76" y="273">Product costs</text>
      <text x="76" y="335">What's live now</text><text x="76" y="397">Ad accounts</text>
      <text x="76" y="459">Email and text lists</text><text x="76" y="521">Real reviews</text>
    </g>

    <!-- col 2: plan -->
    <rect x="346" y="178" width="232" height="362" rx="16" fill="#09090D" stroke="#E63946" stroke-opacity=".55"/>
    <text x="368" y="216" font-size="21" font-weight="700" fill="#FFFFFF">plan.py</text>
    <text x="368" y="240" font-size="15" fill="#A5A5B2">the planner</text>
    <g font-size="17" fill="#FFFFFF">
      <text x="368" y="286">What each order leaves</text>
      <text x="368" y="320">Cap per new customer</text>
      <text x="368" y="354">Break-even ad return</text>
      <text x="368" y="388">Day-by-day calendar</text>
      <text x="368" y="422">Send and refresh days</text>
      <text x="368" y="456">Review days</text>
    </g>
    <text x="368" y="510" font-size="14" fill="#646473">Runs offline. Changes nothing.</text>

    <!-- col 3: creative -->
    <rect x="636" y="178" width="232" height="96" rx="16" fill="#09090D" stroke="#E63946" stroke-opacity=".55"/>
    <text x="658" y="216" font-size="21" font-weight="700" fill="#FFFFFF">creative.md</text>
    <text x="658" y="242" font-size="15" fill="#A5A5B2">concepts, not copies</text>
    <g font-size="17" fill="#FFFFFF">
      <g fill="#09090D" stroke="#FFFFFF" stroke-opacity=".1">
        <rect x="636" y="290" width="232" height="46" rx="12"/><rect x="636" y="346" width="232" height="46" rx="12"/>
        <rect x="636" y="402" width="232" height="46" rx="12"/><rect x="636" y="458" width="232" height="46" rx="12"/>
      </g>
      <text x="656" y="319">A ten-concept slate</text><text x="656" y="375">Real product photos</text>
      <text x="656" y="431">Feed and story sizes</text><text x="656" y="487">One post per ad keeps likes</text>
    </g>
    <text x="636" y="530" font-size="14" fill="#646473">One sample. You approve. Then the set.</text>

    <!-- col 4: channels -->
    <g font-size="17" fill="#FFFFFF">
      <g fill="#09090D" stroke="#FFFFFF" stroke-opacity=".1">
        <rect x="926" y="178" width="218" height="40" rx="10"/><rect x="926" y="224" width="218" height="40" rx="10"/>
        <rect x="926" y="270" width="218" height="40" rx="10"/><rect x="926" y="316" width="218" height="40" rx="10"/>
        <rect x="926" y="362" width="218" height="40" rx="10"/><rect x="926" y="408" width="218" height="40" rx="10"/>
        <rect x="926" y="454" width="218" height="40" rx="10"/><rect x="926" y="500" width="218" height="40" rx="10"/>
      </g>
      <text x="944" y="204">Discounts</text><text x="944" y="250">Meta ads</text>
      <text x="944" y="296">Google ads</text><text x="944" y="342">Email</text>
      <text x="944" y="388">Text messages</text><text x="944" y="434">App push</text>
      <text x="944" y="480">Organic social</text><text x="944" y="526">Storefront</text>
    </g>
    <g font-size="12" font-weight="700" letter-spacing="1" fill="#A5A5B2" text-anchor="end">
      <text x="1132" y="203">SCHEDULED</text><text x="1132" y="249">PAUSED</text><text x="1132" y="295">PAUSED</text>
      <text x="1132" y="341">DRAFT</text><text x="1132" y="387">DRAFT</text><text x="1132" y="433">DRAFT</text>
      <text x="1132" y="479">DRAFT</text><text x="1132" y="525">PREVIEW</text>
    </g>

    <!-- arrows between columns -->
    <g stroke="#E63946" stroke-width="2.5" fill="none" marker-end="url(#a)">
      <path d="M294 359H338"/><path d="M584 359H628"/><path d="M874 359H918"/>
    </g>

    <!-- launch gate -->
    <rect x="56" y="596" width="1088" height="108" rx="18" fill="#E63946"/>
    <text x="88" y="640" font-size="14" font-weight="700" letter-spacing="3" fill="#FFFFFF" fill-opacity=".8">5 · THE GATE</text>
    <text x="88" y="680" font-size="30" font-weight="700" fill="#FFFFFF" letter-spacing="-.5">Nothing goes live until the owner says "launch".</text>
    <text x="1112" y="644" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="end">Then it checks every switch took effect</text>
    <text x="1112" y="668" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="end">and watches cost per new customer daily.</text>

    <!-- loop back -->
    <path d="M1035 546V586" stroke="#E63946" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
    <path d="M172 592V550" stroke="#A5A5B2" stroke-width="2" stroke-dasharray="5 6" fill="none" marker-end="url(#a)"/>
    <text x="186" y="576" font-size="14" fill="#A5A5B2">results feed the next campaign</text>
    <rect x=".5" y=".5" width="1199" height="759" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
  </g>
</svg>
